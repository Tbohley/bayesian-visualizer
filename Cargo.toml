[package]
name = "bayesian-visualizer"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19.0", default-features = false, features = ["2d", "ui", "debug"] }
csv = "1.4.0"
fugue-ppl = "0.1.0"
rand = "0.8"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
bevy = { version = "0.19.0", default-features = false, features = ["dynamic_linking"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
